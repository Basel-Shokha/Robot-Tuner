name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      # engine vs the unmodified upstream simulator, and the native golden runs
      - run: make -C tests test-native
      # the committed WASM build must reproduce the native golden runs; JS unit tests
      - run: make -C tests test-wasm
      # rebuild the WASM from source and test again (catches a stale committed build)
      - uses: mymindstorm/setup-emsdk@v14
        with: { version: 4.0.10 }
      - run: ./sim/build_wasm.sh && make -C tests test-wasm
  # every Arduino sketch the robot builder can generate (board x encoder x driver x sensors) must compile
  firmware:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: latest cores, boards: all, esp32: '' }
          - { name: esp32 core 3.3, boards: esp32, esp32: '@3.3.13' }
    name: firmware (${{ matrix.name }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: arduino/setup-arduino-cli@v2
      - name: cores and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install arduino:avr "esp32:esp32${{ matrix.esp32 }}"
          arduino-cli lib install VL53L0X VL53L1X PinChangeInterrupt
      - run: BOARD=${{ matrix.boards }} ./tools/compile_firmware.sh build/firmware 4
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: firmware-logs-${{ strategy.job-index }}
          path: build/firmware/*/compile.log
