<script type="module">
import { page, t } from './js/common.js';
import { loadEngine, S } from './js/engine.js';
import { defaultRobot } from './js/store.js';
import { defaultEnv } from './js/corridor.js';
import { Scene, Runner, drawScene } from './js/simview.js';
import { PRESETS } from './js/presets.js';
import { View } from './js/draw.js';
await page();
// Live demo: the same robot, same start and same noise, twice: good gains and "P too high".
const E = await loadEngine();
const view = new View(document.getElementById('demo'), { aspect: 0.36, minH: 190, maxH: 320, interactive: false });
let seed = 3, scene, runs = [];
function start() {
  runs.forEach((r) => r.destroy());
  const base = defaultEnv(); base.start = { angle_deg: 22, offset_mm: 25, random: false };
  const [good, env] = PRESETS.good(defaultRobot(), base);
  const [bad] = PRESETS.p_high(defaultRobot(), base);
  scene = new Scene(env);
  runs = [new Runner(E, good, env, { color: '#0f6e52' }), new Runner(E, bad, env, { color: '#d98a00' })];
  scene.update(runs, true);
  const pose = scene.start(good, seed);
  runs.forEach((r) => r.reset(pose, seed));
}
start();
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let last = 0, acc = 0;
function loop(ts) {
  acc += Math.min(0.1, (ts - last) / 1000); last = ts;
  const n = Math.floor(acc / runs[0].dt); acc -= n * runs[0].dt;
  runs.forEach((r) => r.step(n));
  scene.update(runs);
  view.userMoved = false;
  drawScene(view, scene, runs, { rays: true, crashLabel: t('sim.crash') });
  document.getElementById('demo-t').textContent = t('home.demo_time', { s: runs[0].last[S.t].toFixed(1) });
  if (runs[0].last[S.t] > 14 || runs.every((r) => !r.alive)) { seed++; start(); }
  if (!reduce) requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
