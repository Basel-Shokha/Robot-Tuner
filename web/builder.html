<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="nav.builder">Robot builder</title>
<link rel="stylesheet" href="css/style.css"><link rel="icon" href="img/icon.svg">
</head>
<body data-page="builder">
<main>
  <h1 data-i18n="builder.h1"></h1>
  <p class="muted" data-i18n="builder.intro"></p>
  <p class="muted small-note"><span class="req">*</span> <span data-i18n="builder.req_legend"></span></p>
  <div class="tool wide-side">
    <div class="side">
      <div class="card">
        <div class="row"><label for="robot-name" data-i18n="builder.name"></label><input id="robot-name" style="flex:1"></div>
        <div class="row" style="margin-top:8px"><span data-i18n="builder.drive"></span>
          <select id="drive"><option value="2wd" data-i18n="builder.drive_2wd"></option><option value="4wd" data-i18n="builder.drive_4wd"></option></select>
        </div>
      </div>
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="file" data-i18n="builder.tab_file"></button>
        <button role="tab" data-tab="measure" data-i18n="builder.tab_measure"></button>
        <button role="tab" data-tab="geom" aria-selected="true" data-i18n="builder.tab_geom"></button>
        <button role="tab" data-tab="sensors" data-i18n="builder.tab_sensors"></button>
        <button role="tab" data-tab="motor" data-i18n="builder.tab_motor"></button>
        <button role="tab" data-tab="firmware" data-i18n="builder.tab_fw"></button>
      </div>
      <div data-panel="measure" class="stack measure-panel" hidden>
        <p class="muted" data-i18n="ms.intro"></p>
  <section class="card conn-bar" id="conn-bar">
    <div id="nosupport" class="notice warn" hidden data-i18n="ms.nosupport"></div>
    <div class="row conn-row">
      <button class="primary" id="connect"></button><span id="conn-state" class="pill" data-i18n="ms.disconnected"></span>
      <span class="spacer"></span>
      <label class="toggle"><input type="checkbox" id="manual"><span data-i18n="ms.manual"></span></label>
    </div>
    <p class="muted small-note"><span data-i18n="ms.nofw_short"></span> <a href="#firmware" class="to-firmware" data-i18n="ms.fw_btn"></a> · <a href="firmware/robot_tuner_min.ino" download data-i18n="ms.dl_sketch"></a> <span id="hw-line"></span></p>
  </section>
  <p class="progress-line" id="progress"></p>
  <div id="steps"></div>
  <details class="card console-box" id="console">
    <summary data-i18n="ms.console_all"></summary>
    <div class="serial-log" id="log"></div>
    <div class="row"><input id="cmd" style="flex:1" data-i18n-attr="placeholder:ms.cmd_ph"><button id="send" data-i18n="ms.send"></button></div>
    <div id="cmd-buttons"></div>
  </details>
      </div>
      <div data-panel="geom" class="stack"></div>
      <div data-panel="sensors" class="stack" hidden></div>
      <div data-panel="motor" class="stack" hidden></div>
      <div data-panel="firmware" class="stack" hidden></div>
      <div data-panel="file" class="stack" hidden>
        <div class="card stack">
          <h3 data-i18n="builder.robotfile_h"></h3>
          <div class="row"><button class="primary big" id="imp-file" data-i18n="builder.import_file"></button><button id="exp-file" data-i18n="builder.export_file"></button></div>
          <p class="muted" data-i18n="builder.robotfile_p"></p>
        </div>
        <div class="card stack">
          <h3 data-i18n="builder.start_h"></h3>
          <div class="row"><button id="new-2wd" data-i18n="builder.new_2wd"></button><button id="new-4wd" data-i18n="builder.new_4wd"></button><button id="reset-example" data-i18n="builder.reset_example"></button></div>
        </div>
      </div>
    </div>
    <div class="stack">
      <div class="row view-switch" role="group"><button type="button" class="small on" id="view-3d" data-i18n="builder.view_3d"></button><button type="button" class="small" id="view-2d" data-i18n="builder.view_2d"></button><span class="muted small-note" id="view-hint" data-i18n="builder.hint_3d"></span></div>
      <div class="canvas-wrap view3d" id="view3d"><div class="overlay laser-note" id="laser-note" hidden></div></div>
      <div class="canvas-wrap" id="view2d" hidden><canvas id="cv"></canvas><div class="overlay" data-i18n="builder.canvas_hint"></div></div>
      <div id="checks" class="card"></div>
    </div>
  </div>
</main>
<script type="module" src="js/builder.js"></script>
<script type="module" src="js/measure.js"></script>
</body>
</html>
